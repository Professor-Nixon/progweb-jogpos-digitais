<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minhas Notas</title>
</head>
<body>
    <header>
        <h1>Aplicativo de Notas</h1>
    </header>

    <main>
        <section>
            <h2>Nova Nota</h2>
            <form>
                <label for="titulo">Título:</label><br>
                <input type="text" id="titulo" name="titulo"><br><br>

                <label for="conteudo">Conteúdo:</label><br>
                <textarea id="conteudo" name="conteudo"></textarea><br><br>

                <button type="submit">Salvar Nota</button>
            </form>
        </section>

        <section>
            <h2>Minhas Notas</h2>
            <div>
                <h3>Estudar HTML</h3>
                <p>Revisar tags e estrutura.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Versão 1.0 - Desenvolvido por Nixon</p>
    </footer>
</body>
</html>
