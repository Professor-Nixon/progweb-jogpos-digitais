<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receita de Bolo</title>
</head>
<body>
    <header>
        <h1>Receita de Bolo de Chocolate</h1>
    </header>

    <main>
        <article>
            <h2>Ingregientes:</h2>
            <ul>
                <li>2 xícaras de farinha</li>
                <li>1 xícara de açúcar</li>
                <li>1 xícara de chocolate em Pó</li>
            </ul>
            <h2>Modo de Preparo</h2>
            <ol>
                <li>Misture os ingredientes</li>
                <li>Asse por 40 minutos</li>
            </ol>
        </article>
    </main>
    <footer>
        <p>Fonte: Receitas da Vovó</p>
    </footer>
</body>
</html>
